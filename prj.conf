# Debug output through the board's default ST-LINK virtual COM port.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Keep source-level debugging straightforward during bring-up.
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y

# Buffer USART1 input while the receiver thread prints packets.
CONFIG_UART_INTERRUPT_DRIVEN=y

# Both edges of each quadrature channel are counted by GPIO interrupts.
CONFIG_GPIO=y
